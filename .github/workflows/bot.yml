name: 7 Seas News Bot

on:
  schedule:
    - cron: "*/15 * * * *"     # backup only: GitHub often runs this hours late
  # Main timer: cron-job.org starts this workflow every 15 min through the GitHub API
  # (workflow_dispatch with inputs {"force_draft": "false"}), so it runs on time.
  workflow_dispatch:
    inputs:
      force_draft:
        description: "Find news and send drafts to Telegram right now"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write            # lets the bot start the roundup video job (roundup.yml)

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # the bot stays online ~12 min (LISTEN_MINUTES) to answer Telegram fast
    steps:
      # Always load the NEWEST memory (not the version from when this run was started),
      # so a run that waited in line behind another one doesn't send the same news again.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Reels need ffmpeg. Installed only when REELS_ENABLED = True (and only if the runner doesn't have it).
      - name: Install ffmpeg for Reels
        run: |
          if grep -qE '^REELS_ENABLED *= *True' bot/settings.py && ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg && ffmpeg -version | head -1 || echo "ffmpeg not installed (Reels are off)"

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FORCE_DRAFT: ${{ github.event.inputs.force_draft }}
        run: python bot/main.py

      - name: Save bot memory
        if: always()
        run: |
          git config user.name "7seas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state/state.json /tmp/state.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json state/state.json
            git add state/state.json
            git diff --cached --quiet && exit 0
            git commit -m "Update bot state"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # The bot asks for the daily roundup videos by writing this file. Started only AFTER the memory is saved,
      # so the video job reads the approved plan.
      - name: Start roundup video job (if the bot asked for it)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          f=/tmp/7seas_roundup_dispatch.json
          [ -f "$f" ] || exit 0
          python - "$f" <<'PY'
          import json, os, sys, requests
          for r in json.load(open(sys.argv[1])):
              res = requests.post(f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/roundup.yml/dispatches",
                                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                                           "Accept": "application/vnd.github+json"},
                                  json={"ref": "main", "inputs": {"day": r["day"], "test": r["test"]}}, timeout=30)
              print("roundup job", r, "->", res.status_code, res.text[:200])
          PY
