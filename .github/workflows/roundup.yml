name: 7 Seas Roundup Videos

# Started by the bot itself (bot.yml) after you approve the day's roundup plan in Telegram,
# or after ROUNDUP_AUTO_APPROVE_HOURS without an answer. You can also start it by hand here.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "New York day (YYYY-MM-DD) with an approved plan · or \"preview YYYY-MM-DD\" = design dry run to Telegram"
        required: true
      test:
        description: "Test only: send everything to Telegram, upload nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roundup
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install ffmpeg + fribidi (text kerning, needed for the exact design)
        run: |
          if ! command -v ffmpeg >/dev/null || ! ldconfig -p | grep -q libfribidi; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libfribidi0
          fi

      # The roundup must look exactly like the approved design (tests/golden). If not, nothing is made.
      - name: Golden design test
        run: python tests/test_roundup_design.py

      - name: Make and post the roundup videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python bot/roundup.py --day "${{ github.event.inputs.day }}" ${{ github.event.inputs.test == 'true' && '--test' || '' }}

      # Only state/roundup.json is written here (the normal bot owns state/state.json).
      - name: Save roundup results
        if: always()
        run: |
          [ -f state/roundup.json ] || exit 0
          git config user.name "7seas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state/roundup.json /tmp/roundup.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/roundup.json state/roundup.json
            git add state/roundup.json
            git diff --cached --quiet && exit 0
            git commit -m "Update roundup results"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
